[package]
name = "net-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = { version = "0.1.41" }                                     #, features = ["release_max_level_debug"] }
nix = { version = "0.30", features = ["fs", "socket"] }
log = "0.4.0"
libc = ">=0.2.39"
crossbeam-channel = "0.5.15"
bytes = "1"
mio = { version = "1.0.4", features = ["net", "os-ext", "os-poll"] }
socket2 = { version = "0.5.10", features = ["all"] }
pnet = "0.35.0"
rand = "0.9.1"
utils = { path = "../utils" }
crc = "3.3.0"

[dev-dependencies]
tracing-subscriber = "0.3.19"
lazy_static = "*"
tempfile = "*"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "net_proxy_benchmarks"
harness = false
